<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Smart BlinkAid">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon (Smart BlinkAid logo) -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Smart BlinkAid</title>
  <link rel="manifest" href="manifest.json">

  <!-- Firebase (compat build) is required because this project uses a classic
       service-worker setup (firebase-messaging-sw.js) and the global `firebase`
       object inside that worker. -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-messaging-compat.js"></script>

  <script>
    // Keep this page lightweight: Flutter initializes Firebase from Dart.
    // Background handling is configured in `firebase-messaging-sw.js`.
  </script>
</head>
<body>
  <script>
    // Ensure Firebase background notifications work reliably on Flutter Web.
    // Register as early as possible (no reliance on `load` timing).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker
        .register('/firebase-messaging-sw.js')
        .then(function (registration) {
          console.log('✅ Service Worker registered:', registration.scope);
        })
        .catch(function (err) {
          console.error('❌ Service Worker registration failed:', err);
        });
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
